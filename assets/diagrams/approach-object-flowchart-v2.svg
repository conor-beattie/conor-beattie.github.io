<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1980" viewBox="0 0 1400 1980" role="img" aria-label="Approach Object flowchart: track selected target, choose Stage 2 visual servoing (PBVS, IBVS or Smooth Control) or Stage 1 timed navigation, avoid obstacles, recover or fail, and transition successfully to Pickup Object.">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L9,5 L1,9 Z" fill="#35465A"/></marker>
  <style>
    text { font-family: 'Arial', 'Liberation Sans', sans-serif; fill: #243449; }
    .heading { font-size: 33px; font-weight: 700; letter-spacing: 1px; }
    .subhead { font-size: 16px; fill:#64748B; }
    .node { font-size:21px; font-weight: 600; }
    .second { font-size:17px; font-weight:400; }
    .edge { font-size:17px; font-weight:700; fill:#3A5269; stroke:none; }
    .path { fill:none; stroke:#35465A; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    .path-muted { fill:none; stroke:#64748B; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:8 6; marker-end:url(#arrow); }
  </style>
</defs>
