<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1410" width="1160" height="1410" role="img" aria-labelledby="flowtitle flowdesc"><title id="flowtitle">Bobbot autonomous Return-to-Base — simplified flowchart</title><desc id="flowdesc">15-node engineering flowchart. After checking whether visual navigation is available, the robot either executes a preprogrammed open-loop fallback or reads AprilTags, pose and object observations. It acquires return guides, searches when guides are lost, chooses the furthest eligible route guide, avoids obstacles, guides towards the final tag and uses wall following for a side-on terminal approach when safe. Success does not itself release the carried object.</desc><rect width="1160" height="1410" fill="#FFFFFF" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9.1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5579AD" /></marker></defs><path d="M 550 135 V 170" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 550 266 V 315" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="571" y="289.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="571" dy="0">Yes</tspan></text><path d="M 664 218 H 793" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="730" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="730" dy="0">No</tspan></text><path d="M 910 250 V 291" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 550 385 V 426" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 550 526 V 558" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="574" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="574" dy="0">Yes</tspan></text><path d="M 430 476 H 330" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="378" y="458.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="378" dy="0">No</tspan></text><path d="M 70 476 H 47 V 350 H 394" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="283" y="335.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="283" dy="0">Recovered</tspan></text><path d="M 550 628 V 663" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 550 765 V 807" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="575" y="784.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="575" dy="0">No</tspan></text><path d="M 665 714 H 780" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="721" y="694.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="721" dy="0">Yes</tspan></text><path d="M 1030 714 H 1083 V 375 H 702" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="1029" y="538.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="1029" dy="0">Reassess</tspan></text><path d="M 550 879 V 918" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M 550 1022 V 1253" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="573" y="1125.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="573" dy="0">Yes</tspan></text><path d="M 670 970 H 790" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="727" y="950.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="727" dy="0">No</tspan></text><path d="M 900 1022 V 1065" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="927" y="1042.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="927" dy="0">Yes</tspan></text><path d="M 900 1141 V 1280 H 685" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="817" y="1262.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="817" dy="0">Final leg complete</tspan></text><path d="M 1010 970 H 1122 V 148 H 742 V 350 H 717" stroke="#5278AA" stroke-width="2.0" fill="none" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="1060" y="951.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#425A71" text-anchor="middle" dominant-baseline="middle"><tspan x="1060" dy="0">No: continue</tspan></text><rect x="428.0" y="85.0" width="244" height="50" rx="25.0" fill="#EAF6F4" stroke="#15828A" stroke-width="2.3" /><text x="550" y="110.0" font-family="Arial, Helvetica, sans-serif" font-size="17.4" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">Begin Return-to-Base</tspan></text><polygon points="550,170.0 664.0,218 550,266.0 436.0,218" fill="#F3F8FC" stroke="#5278AA" stroke-width="2.1" /><text x="550" y="207.312" font-family="Arial, Helvetica, sans-serif" font-size="16.7" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">Visual navigation</tspan><tspan x="550" dy="21.376">enabled?</tspan></text><rect x="794.0" y="184.0" width="232" height="66" fill="#EDF8F8" stroke="#15828A" stroke-width="2.1" /><line x1="810.0" y1="184.0" x2="810.0" y2="250.0" stroke="#15828A" stroke-width="1.8" /><line x1="1010.0" y1="184.0" x2="1010.0" y2="250.0" stroke="#15828A" stroke-width="1.8" /><text x="910" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="16.4" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="910" dy="0">Open-loop return control</tspan></text><text x="910" y="234.0" font-family="Arial, Helvetica, sans-serif" font-size="12.7" font-weight="normal" fill="#536776" text-anchor="middle" dominant-baseline="middle"><tspan x="910" dy="0">preset motion; no visual feedback</tspan></text><rect x="801.5" y="291.0" width="217" height="48" rx="24.0" fill="#EAF6F4" stroke="#15828A" stroke-width="2.3" /><text x="910" y="315.0" font-family="Arial, Helvetica, sans-serif" font-size="17.4" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="910" dy="0">Fallback complete</tspan></text><polygon points="425.0,315.0 710.0,315.0 675.0,385.0 390.0,385.0" fill="#EFF6FD" stroke="#5278AA" stroke-width="2.1" /><text x="550" y="339.376" font-family="Arial, Helvetica, sans-serif" font-size="16.6" font-weight="normal" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">Read AprilTags, pose</tspan><tspan x="550" dy="21.248">and detected objects</tspan></text><polygon points="550,426.0 670.0,476 550,526.0 430.0,476" fill="#F3F8FC" stroke="#5278AA" stroke-width="2.1" /><text x="550" y="465.312" font-family="Arial, Helvetica, sans-serif" font-size="16.7" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">Return guide</tspan><tspan x="550" dy="21.376">visible?</tspan></text><rect x="70.0" y="440.0" width="260" height="72" fill="#EDF8F8" stroke="#15828A" stroke-width="2.1" /><line x1="86.0" y1="440.0" x2="86.0" y2="512.0" stroke="#15828A" stroke-width="1.8" /><line x1="314.0" y1="440.0" x2="314.0" y2="512.0" stroke="#15828A" stroke-width="1.8" /><text x="200" y="465.0" font-family="Arial, Helvetica, sans-serif" font-size="16.4" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="200" dy="0">Search / recover guide</tspan></text><text x="200" y="493.0" font-family="Arial, Helvetica, sans-serif" font-size="12.7" font-weight="normal" fill="#536776" text-anchor="middle" dominant-baseline="middle"><tspan x="200" dy="0">rotate, peek, back off, realign</tspan></text><rect x="410.0" y="558.0" width="280" height="70" fill="#FFFFFF" stroke="#5278AA" stroke-width="2.0" /><text x="550" y="582.12" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">Select furthest eligible</tspan><tspan x="550" dy="21.76">route guide</tspan></text><polygon points="550,663.0 665.0,714 550,765.0 435.0,714" fill="#F3F8FC" stroke="#5278AA" stroke-width="2.1" /><text x="550" y="703.312" font-family="Arial, Helvetica, sans-serif" font-size="16.7" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">Path obstructed</tspan><tspan x="550" dy="21.376">by objects?</tspan></text><rect x="780.0" y="679.0" width="250" height="70" fill="#EDF8F8" stroke="#15828A" stroke-width="2.1" /><line x1="796.0" y1="679.0" x2="796.0" y2="749.0" stroke="#15828A" stroke-width="1.8" /><line x1="1014.0" y1="679.0" x2="1014.0" y2="749.0" stroke="#15828A" stroke-width="1.8" /><text x="905" y="703.0" font-family="Arial, Helvetica, sans-serif" font-size="16.4" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="905" dy="0">LocalAvoidance</tspan></text><text x="905" y="731.0" font-family="Arial, Helvetica, sans-serif" font-size="12.7" font-weight="normal" fill="#536776" text-anchor="middle" dominant-baseline="middle"><tspan x="905" dy="0">rejoin visible guide route</tspan></text><rect x="410.0" y="807.0" width="280" height="72" fill="#EDF8F8" stroke="#15828A" stroke-width="2.1" /><line x1="426.0" y1="807.0" x2="426.0" y2="879.0" stroke="#15828A" stroke-width="1.8" /><line x1="674.0" y1="807.0" x2="674.0" y2="879.0" stroke="#15828A" stroke-width="1.8" /><text x="550" y="832.0" font-family="Arial, Helvetica, sans-serif" font-size="16.4" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">Track / hop guide tags</tspan></text><text x="550" y="860.0" font-family="Arial, Helvetica, sans-serif" font-size="12.7" font-weight="normal" fill="#536776" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">visual steering and handoff</tspan></text><polygon points="550,918.0 670.0,970 550,1022.0 430.0,970" fill="#F3F8FC" stroke="#5278AA" stroke-width="2.1" /><text x="550" y="959.312" font-family="Arial, Helvetica, sans-serif" font-size="16.7" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">Final guide stop</tspan><tspan x="550" dy="21.376">reached?</tspan></text><polygon points="900,918.0 1010.0,970 900,1022.0 790.0,970" fill="#F3F8FC" stroke="#5278AA" stroke-width="2.1" /><text x="900" y="959.312" font-family="Arial, Helvetica, sans-serif" font-size="16.7" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="900" dy="0">Side-on approach</tspan><tspan x="900" dy="21.376">and safe wall entry?</tspan></text><rect x="765.0" y="1065.0" width="270" height="76" fill="#EDF8F8" stroke="#15828A" stroke-width="2.1" /><line x1="781.0" y1="1065.0" x2="781.0" y2="1141.0" stroke="#15828A" stroke-width="1.8" /><line x1="1019.0" y1="1065.0" x2="1019.0" y2="1141.0" stroke="#15828A" stroke-width="1.8" /><text x="900" y="1092.0" font-family="Arial, Helvetica, sans-serif" font-size="16.4" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="900" dy="0">Follow wall + final drive</tspan></text><text x="900" y="1120.0" font-family="Arial, Helvetica, sans-serif" font-size="12.7" font-weight="normal" fill="#536776" text-anchor="middle" dominant-baseline="middle"><tspan x="900" dy="0">use final guide camera-edge event</tspan></text><rect x="415.0" y="1253.0" width="270" height="54" rx="27.0" fill="#EAF6F4" stroke="#15828A" stroke-width="2.3" /><text x="550" y="1280.0" font-family="Arial, Helvetica, sans-serif" font-size="17.4" font-weight="bold" fill="#22394B" text-anchor="middle" dominant-baseline="middle"><tspan x="550" dy="0">Return navigation complete</tspan></text><text x="50" y="26.0" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#15828A" text-anchor="start" dominant-baseline="middle"><tspan x="50" dy="0">BOBBOT  /  SOFTWARE &amp; ALGORITHMS</tspan></text><text x="50" y="59.0" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#22394B" text-anchor="start" dominant-baseline="middle"><tspan x="50" dy="0">AUTONOMOUS RETURN-TO-BASE</tspan></text><line x1="50" y1="1370" x2="1110" y2="1370" stroke="#DCE7ED" stroke-width="1.5" /><text x="50" y="1388.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" fill="#556777" text-anchor="start" dominant-baseline="middle"><tspan x="50" dy="0">Simplified code-derived process • recovery can fail safely • optional stacking and object release are separate behaviours</tspan></text></svg>